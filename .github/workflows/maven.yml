name: Java CI with Maven
on:
  push:
    paths:
      - Dockerfile

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Build with Maven
        run: mvn clean install

      - name: Build the Docker image
        run: docker build -t hassaneid/java:v${{ github.run_number }} .

      - name: Login to DockerHub
        run: docker login -u ${{ secrets.DOCKERUSERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Push the Docker image
        run: docker push hassaneid/java:v${{ github.run_number }}

  test:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run command to test
        run: sleep 30